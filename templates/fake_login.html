<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Redirect to simulated page after 3 seconds -->
    <meta http-equiv="refresh" content="3;url=/simulated">
    <title>Sign in to your account</title>
    <style>
        body {
            font-family: "Segoe UI", "Helvetica Neue", "Lucida Grande", "Roboto", "Ebrima", "Nirmala UI", "Gadugi", "Segoe Xbox Symbol", "Segoe UI Symbol", "Meiryo UI", "Khmer UI", "Tunga", "Lao UI", "Raavi", "Iskoola Pota", "Latha", "Leelawadee", "Microsoft YaHei UI", "Microsoft JhengHei UI", "Malgun Gothic", "Estrangelo Edessa", "Microsoft Himalaya", "Microsoft New Tai Lue", "Microsoft PhagsPa", "Microsoft Tai Le", "Microsoft Yi Baiti", "Mongolian Baiti", "MV Boli", "Myanmar Text", "Cambria Math";
            background-color: #f3f2f1;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            background-color: white;
            width: 100%;
            max-width: 440px;
            padding: 44px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            box-sizing: border-box;
        }
        .logo {
            height: 24px;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 24px;
            color: #1b1b1b;
            font-weight: 600;
            margin-bottom: 16px;
            margin-top: 0;
        }
        .input-group {
            margin-bottom: 16px;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px 0;
            font-size: 15px;
            border: none;
            border-bottom: 1px solid #666;
            outline: none;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            border-bottom: 2px solid #0067b8;
        }
        .no-account {
            font-size: 13px;
            margin-bottom: 32px;
        }
        .no-account a {
            color: #0067b8;
            text-decoration: none;
        }
        .no-account a:hover {
            text-decoration: underline;
        }
        .action-row {
            display: flex;
            justify-content: flex-end;
        }
        .btn-next {
            background-color: #0067b8;
            color: white;
            border: none;
            padding: 10px 32px;
            font-size: 15px;
            cursor: pointer;
        }
        .btn-next:hover {
            background-color: #005da6;
        }
        .loader-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }
        .dots {
            display: flex;
            gap: 5px;
        }
        .dot {
            width: 8px; height: 8px;
            background-color: #0067b8;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="login-box">
        <!-- SVG Microsoft Logo -->
        <svg class="logo" viewBox="0 0 23 23" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="11" height="11" fill="#f25022"/>
            <rect x="12" width="11" height="11" fill="#7fba00"/>
            <rect y="12" width="11" height="11" fill="#00a4ef"/>
            <rect x="12" y="12" width="11" height="11" fill="#ffb900"/>
        </svg>
        <h1>Sign in</h1>
        <div class="input-group">
            <input type="text" placeholder="Email, phone, or Skype" disabled value="Loading secure session...">
        </div>
        <div class="no-account">
            No account? <a href="#">Create one!</a>
        </div>
        <div class="action-row">
            <button class="btn-next" disabled>Next</button>
        </div>
    </div>

    <!-- Fake loader to make the 3-second wait feel natural -->
    <div class="loader-overlay">
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <p style="margin-top: 15px; color: #666; font-family: 'Segoe UI', sans-serif;">Securing connection...</p>
    </div>

</body>
</html>
