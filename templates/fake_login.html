<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to your account</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <style>
        body {
            font-family: "Segoe UI", "Helvetica Neue", "Lucida Grande", "Roboto", "Ebrima", "Nirmala UI", "Gadugi", "Segoe Xbox Symbol", "Segoe UI Symbol", "Meiryo UI", "Khmer UI", "Tunga", "Lao UI", "Raavi", "Iskoola Pota", "Latha", "Leelawadee", "Microsoft YaHei UI", "Microsoft JhengHei UI", "Malgun Gothic", "Estrangelo Edessa", "Microsoft Himalaya", "Microsoft New Tai Lue", "Microsoft PhagsPa", "Microsoft Tai Le", "Microsoft Yi Baiti", "Mongolian Baiti", "MV Boli", "Myanmar Text", "Cambria Math";
            background-color: #f3f2f1;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            background-color: white;
            width: 100%;
            max-width: 440px;
            padding: 44px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            box-sizing: border-box;
        }
        .logo {
            height: 24px;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 24px;
            color: #1b1b1b;
            font-weight: 600;
            margin-bottom: 16px;
            margin-top: 0;
        }
        .input-group {
            margin-bottom: 16px;
        }
        input[type="email"] {
            width: 100%;
            padding: 8px 0;
            font-size: 15px;
            border: none;
            border-bottom: 1px solid #666;
            outline: none;
            box-sizing: border-box;
        }
        input[type="email"]:focus {
            border-bottom: 2px solid #0067b8;
        }
        .no-account {
            font-size: 13px;
            margin-bottom: 32px;
        }
        .no-account a {
            color: #0067b8;
            text-decoration: none;
        }
        .no-account a:hover {
            text-decoration: underline;
        }
        .action-row {
            display: flex;
            justify-content: flex-end;
        }
        .btn-next {
            background-color: #0067b8;
            color: white;
            border: none;
            padding: 10px 32px;
            font-size: 15px;
            cursor: pointer;
        }
        .btn-next:hover {
            background-color: #005da6;
        }
        .loader-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }
        .dots {
            display: flex;
            gap: 5px;
        }
        .dot {
            width: 8px; height: 8px;
            background-color: #0067b8;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="login-box">
        <!-- SVG Microsoft Logo -->
        <svg class="logo" viewBox="0 0 23 23" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="11" height="11" fill="#f25022"/>
            <rect x="12" width="11" height="11" fill="#7fba00"/>
            <rect y="12" width="11" height="11" fill="#00a4ef"/>
            <rect x="12" y="12" width="11" height="11" fill="#ffb900"/>
        </svg>
        <h1>Sign in</h1>
        <form id="login-form">
            <div class="input-group">
                <input type="email" id="email-input" placeholder="Email, phone, or Skype" required>
            </div>
            <div class="no-account">
                No account? <a href="#">Create one!</a>
            </div>
            <div class="action-row">
                <button type="submit" class="btn-next">Next</button>
            </div>
        </form>
    </div>

    <!-- Fake loader to make the wait feel natural -->
    <div id="loader" class="loader-overlay">
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <p style="margin-top: 15px; color: #666; font-family: 'Segoe UI', sans-serif;">Securing connection...</p>
    </div>

    <script>
        // CSRF Fetch Interceptor for fake_login.html and lure_bot widget
        (function() {
            const nativeFetch = window.fetch.bind(window);
            window.fetch = (input, init) => {
                let url = "";
                let method = "GET";
                if (typeof input === "string" || input instanceof URL) {
                    url = input.toString();
                    if (init && init.method) {
                        method = init.method.toUpperCase();
                    }
                } else if (input && typeof input === "object") {
                    url = input.url || "";
                    method = (input.method || "GET").toUpperCase();
                }
                const isPost = ["POST", "PUT", "DELETE", "PATCH"].includes(method);
                const isSameOrigin = !url.startsWith("http://") && !url.startsWith("https://") || url.startsWith(window.location.origin);
                if (isPost && isSameOrigin) {
                    const token = "{{ csrf_token() }}";
                    if (token) {
                        if (!init) init = {};
                        if (!init.headers) init.headers = {};
                        if (init.headers instanceof Headers) {
                            if (!init.headers.has('X-CSRFToken')) {
                                init.headers.append('X-CSRFToken', token);
                            }
                        } else if (Array.isArray(init.headers)) {
                            const hasCsrf = init.headers.some(h => h[0].toLowerCase() === 'x-csrftoken');
                            if (!hasCsrf) init.headers.push(['X-CSRFToken', token]);
                        } else {
                            const hasCsrf = Object.keys(init.headers).some(k => k.toLowerCase() === 'x-csrftoken');
                            if (!hasCsrf) init.headers['X-CSRFToken'] = token;
                        }
                    }
                }
                return nativeFetch(input, init);
            };
        })();

        const form = document.getElementById('login-form');
        const loader = document.getElementById('loader');
        const trackingId = "{{ tracking_id }}";

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            loader.style.display = 'flex';
            
            fetch('/submit/' + trackingId, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(res => res.json())
            .then(data => {
                setTimeout(() => {
                    window.location.href = data.redirect_url;
                }, 1000);
            })
            .catch(err => {
                console.error("Submission failed:", err);
                window.location.href = '/simulated?id=' + trackingId;
            });
        });
    </script>
    {% include 'lure_bot.html' %}
</body>
</html>
