{% extends 'base.html' %}

{% block title %}New Campaign - PhishSim AI{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div class="dashboard-header" style="margin-bottom: 1rem;">
        <a href="/dashboard" style="color: var(--text-muted); font-size: 0.875rem;">&larr; Back to Dashboard</a>
    </div>

    <div class="card">
        <h2 style="margin-bottom: 0.5rem;">Create New Campaign</h2>
        <p style="margin-bottom: 2rem;">Configure the parameters for your next AI-driven phishing test.</p>
        
        <form action="/new-campaign" method="POST">
            <div class="form-group">
                <label for="campaign_name">Campaign Name</label>
                <input type="text" id="campaign_name" name="campaign_name" placeholder="e.g. Q3 Security Audit" required>
            </div>

            <div class="form-group">
                <label for="company_domain">Company Domain to Scrape (OSINT)</label>
                <input type="text" id="company_domain" name="company_domain" placeholder="example.com" required>
            </div>

            <div class="form-group">
                <label for="scenario">AI Generation Scenario</label>
                <select id="scenario" name="scenario">
                    <option value="ceo_fraud">CEO Fraud (Wire Transfer)</option>
                    <option value="it_alert">IT Alert (Password Reset)</option>
                    <option value="hr_update">HR Update (Benefits Portal)</option>
                    <option value="invoice">Urgent Invoice (Finance)</option>
                </select>
            </div>

            <div class="form-group" style="background: rgba(59, 130, 246, 0.1); padding: 1rem; border-radius: var(--radius-md); border: 1px solid rgba(59, 130, 246, 0.2); margin-top: 2rem;">
                <label style="display: flex; align-items: flex-start; gap: 0.75rem; margin: 0; cursor: pointer;">
                    <input type="checkbox" name="consent_confirmed" value="yes" required style="margin-top: 0.25rem;">
                    <span style="font-weight: normal; font-size: 0.9rem;">
                        <strong>Authorization Required</strong><br>
                        I confirm that I have explicit written permission to perform a phishing simulation test against this domain and its employees.
                    </span>
                </label>
            </div>

            <div style="margin-top: 2rem; display: flex; justify-content: flex-end;">
                <button type="submit" class="btn-primary">Create & Continue</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
