{% extends 'base.html' %}

{% block title %}Service temporarily unavailable — PhishSim AI{% endblock %}

{% block content %}
<main class="error-page-container">
    <div class="error-card">
        <span class="error-code-badge">503</span>
        <h1 class="error-title">Service temporarily unavailable</h1>
        <p class="error-message">We are currently undergoing quick maintenance or reconnecting to our secure database.</p>
        <a href="{{ referrer or '/' }}" class="error-action-btn">
            <i class="ti ti-refresh" aria-hidden="true"></i>
            <span>Try again</span>
        </a>
    </div>
</main>
{% endblock %}
