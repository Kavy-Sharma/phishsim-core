{% extends 'base.html' %}

{% block title %}Service Unavailable - PhishSim AI{% endblock %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
@keyframes popIn {
    0% { opacity: 0; transform: scale(0.95); }
    100% { opacity: 1; transform: scale(1); }
}

body.light-theme .unavailable-card-container {
    background: #ffffff !important;
    border-color: #cbd5e1 !important;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.06) !important;
}
body.light-theme .unavailable-card-container h2 {
    color: #0f172a !important;
}
body.light-theme .unavailable-card-container p {
    color: #334155 !important;
}
body.light-theme .unavailable-tip {
    background: #f8fafc !important;
    border-color: #cbd5e1 !important;
    color: #334155 !important;
}
</style>

<div style="background: var(--bg-base); min-height: 80vh; padding: 2rem; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: 'Space Grotesk', sans-serif; position: relative; z-index: 2;">

    <div class="unavailable-card-container" style="
        max-width: 520px;
        width: 100%;
        box-sizing: border-box;
        animation: popIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        background: var(--bg-surface);
        border: 1px solid var(--border-default);
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        padding: 40px;
        text-align: center;
    ">
        <!-- Connection blip icon -->
        <div style="color: var(--amber, #f59e0b); margin-bottom: 24px; display: inline-flex; justify-content: center; align-items: center; width: 64px; height: 64px; background: rgba(245, 158, 11, 0.08); border: 1px solid rgba(245, 158, 11, 0.2); border-radius: 50%;">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        </div>

        <h2 style="font-size: 1.6rem; font-weight: 700; color: var(--text-primary); margin: 0 0 16px 0; line-height: 1.3;">
            Connection Error
        </h2>
        
        <p style="font-size: 0.95rem; color: var(--text-secondary); line-height: 1.6; margin: 0 0 32px 0;">
            We're having trouble connecting right now. Please try again in a few minutes.
        </p>

        <a href="{{ referrer }}" class="btn-primary-filled" style="display: inline-flex; width: 100%; text-decoration: none; font-weight: 700; align-items: center; justify-content: center;">
            <i class="ti ti-refresh" style="margin-right: 8px; font-size: 1.1rem;"></i> Try again
        </a>
    </div>
</div>
{% endblock %}
